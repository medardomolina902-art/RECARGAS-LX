<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RECARGAS LX | Administración</title><link rel="stylesheet" href="style.css"><style>body{background:#090508;color:#fff}.admin{max-width:880px;margin:25px auto;padding:22px;background:#16090e;border:1px solid #8b2135;border-radius:18px}input{width:100%;margin:8px 0 14px}button{padding:12px 18px;border-radius:10px;background:#d0002b;color:white;border:0;cursor:pointer}.price{display:grid;grid-template-columns:1fr 125px 90px;align-items:center;gap:10px;border-bottom:1px solid #522;padding:10px 0}.price input{margin:0}.price button{background:#4a1723}#msg{color:#ff8da2}h3{color:#ff607d}a{color:#ff91a3}@media(max-width:580px){.price{grid-template-columns:1fr 90px}.price button{grid-column:span 2}}</style></head><body><div class="admin"><h1>⚙️ RECARGAS LX — Administrador</h1><p><a href="index.html">← Volver a la tienda</a></p><p>Precios en USD. Los cambios se guardan en Cloudflare D1 y se publican para todos los clientes.</p><section id="login"><label>Contraseña de administrador</label><input id="password" type="password" autocomplete="current-password"><button id="enter">Entrar</button></section><section id="editor" hidden><button id="logout">Cerrar sesión</button><div id="items"></div></section><p id="msg" role="status"></p></div><script src="config.js"></script><script src="admin.js"></script></body></html>
